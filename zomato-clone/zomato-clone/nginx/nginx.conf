worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── upstream services ─────────────────────────────────────────────────────
    upstream user_service       { server user-service:8001; }
    upstream restaurant_service { server restaurant-service:8002; }
    upstream order_service      { server order-service:8003; }
    upstream frontend           { server frontend:4200; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # ── API routes ────────────────────────────────────────────────────────
        location /api/users/ {
            proxy_pass http://user_service/;
        }

        location /api/restaurants/ {
            proxy_pass http://restaurant_service/;
        }

        location /api/orders/ {
            proxy_pass http://order_service/;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Angular dev server (forward everything else) ──────────────────────
        location / {
            proxy_pass http://frontend/;
        }
    }
}
