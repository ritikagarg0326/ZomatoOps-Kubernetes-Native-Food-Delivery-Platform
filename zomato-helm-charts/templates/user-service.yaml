apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.userService.replicas }}
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
      - name: wait-for-mongo
        image: busybox
        command: ['sh', '-c', 'until nc -z mongodb-user 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
      - name: user-service
        image: {{ .Values.userService.image }}:{{ .Values.userService.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.userService.port }}
        env:
        - name: MONGODB_URL
          value: {{ .Values.userService.env.mongodbUrl }}
        - name: DATABASE_NAME
          value: {{ .Values.userService.env.databaseName }}
        - name: SECRET_KEY
          value: {{ .Values.userService.env.secretKey }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.userService.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.userService.port }}
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: user-service
  ports:
    - port: {{ .Values.userService.port }}
      targetPort: {{ .Values.userService.port }}
  type: ClusterIP
