name: ZomatoOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'zomato-helm-charts/**'
      - 'k8s/**'
      - 'README.md'
  pull_request:
    branches: [dev, main]

# ─────────────────────────────────────────────
# JOB 1 — CODE QUALITY
# ─────────────────────────────────────────────
jobs:

  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint user-service
        run: |
          cd user-service
          pip install flake8 --quiet
          flake8 . --count --max-line-length=120 --statistics || true

      - name: Lint restaurant-service
        run: |
          cd restaurant-service
          pip install flake8 --quiet
          flake8 . --count --max-line-length=120 --statistics || true

      - name: Lint order-service
        run: |
          cd order-service
          pip install flake8 --quiet
          flake8 . --count --max-line-length=120 --statistics || true

# ─────────────────────────────────────────────
# JOB 2 — BUILD & TEST
# ─────────────────────────────────────────────

  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Test user-service
        run: |
          cd user-service
          pip install -r requirements.txt --quiet
          python -m pytest tests/ -v || true

      - name: Install & Test restaurant-service
        run: |
          cd restaurant-service
          pip install -r requirements.txt --quiet
          python -m pytest tests/ -v || true

      - name: Install & Test order-service
        run: |
          cd order-service
          pip install -r requirements.txt --quiet
          python -m pytest tests/ -v || true

# ─────────────────────────────────────────────
# JOB 3 — BUILD & PUSH DOCKER IMAGES
# ─────────────────────────────────────────────

  push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zomato-user-service:${{ github.run_id }}

      - name: Build & Push restaurant-service
        uses: docker/build-push-action@v6
        with:
          context: ./restaurant-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zomato-restaurant-service:${{ github.run_id }}

      - name: Build & Push order-service
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zomato-order-service:${{ github.run_id }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zomato-frontend:${{ github.run_id }}

      - name: Build & Push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zomato-nginx:${{ github.run_id }}

# ─────────────────────────────────────────────
# JOB 4 — UPDATE HELM CHART VALUES
# ─────────────────────────────────────────────

  update-helm-chart:
    name: 📦 Update Helm Chart Tag
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update image tags in values.yaml
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' zomato-helm-charts/values.yaml

      - name: Commit and push updated Helm values
        run: |
          git config --global user.email "ritikagarg60814@gmail.com"
          git config --global user.name "GitHub Actions"
          git add zomato-helm-charts/values.yaml
          git commit -m "ci: update image tags to ${{ github.run_id }}"
          git push

# ─────────────────────────────────────────────
# JOB 5 — DEPLOY (optional, for non-ArgoCD setups)
# ─────────────────────────────────────────────

  deploy:
    name: 🚀 Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: update-helm-chart
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Deploy via Helm
        run: |
          helm upgrade --install zomato ./zomato-helm-charts \
            --namespace zomato-dev \
            --create-namespace \
            --set userService.tag=${{ github.run_id }} \
            --set restaurantService.tag=${{ github.run_id }} \
            --set orderService.tag=${{ github.run_id }} \
            --set frontend.tag=${{ github.run_id }} \
            --set nginx.tag=${{ github.run_id }} \
            --wait --timeout=120s

      - name: Verify deployment
        run: kubectl get pods -n zomato-dev